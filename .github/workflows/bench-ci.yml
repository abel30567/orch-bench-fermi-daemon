name: bench-ci
on:
  pull_request:
permissions:
  contents: read
jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y zsh
      - name: Setup
        run: |
          npm ci --no-audit --no-fund
      - name: Gates
        run: |
          for d in wa-bridge dc-bridge sl-bridge; do (cd $d && npm ci --no-audit --no-fund && npm test && npm run typecheck) || exit 1; done && node --check warm-worker.mjs && node --check box-runner.mjs && zsh -n poll.sh && python3 -m py_compile narrator.py && if [ -f package.json ] && grep -q '"test"' package.json; then npm test; fi
